version: 2
updates:
  # 1. npm パッケージの自動更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 本番依存パッケージのまとめ
      production-dependencies:
        dependency-type: "production"
      # 開発用依存パッケージのまとめ
      development-dependencies:
        dependency-type: "development"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]

  # 2. GitHub Actions ワークフローの自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
